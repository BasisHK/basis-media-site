name: basis-media-site
region: sgp
services:
  - name: web
    github:
      repo: BasisHK/basis-media-site
      branch: master
      deploy_on_push: true
    source_dir: /
    environment_slug: node-js
    instance_count: 1
    instance_size_slug: basic-xxs
    http_port: 8080
    build_command: npm ci
    run_command: npm start
    routes:
      - path: /
    health_check:
      http_path: /
    envs:
      - key: NODE_ENV
        value: production
        scope: RUN_TIME
      - key: MAILTRAP_API_TOKEN
        scope: RUN_TIME
        type: SECRET
      - key: MAILTRAP_FROM_EMAIL
        value: business@basis.hk
        scope: RUN_TIME
      - key: MAILTRAP_FROM_NAME
        value: Basis
        scope: RUN_TIME
      - key: MAILTRAP_TO_EMAIL
        value: business@basis.hk
        scope: RUN_TIME
